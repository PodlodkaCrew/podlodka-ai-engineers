</style></head><body><main><h1>Level Up — анкета команды <span class="badge">xmemory</span></h1><div class="meta">Репозиторий: <a href="https://github.com/podlodka-ai-club/level-up" target="_blank" rel="noopener">https://github.com/podlodka-ai-club/level-up</a> · ответ отправлен 07.09.2026 20:40:17</div><section class="qa"><h2>Представьте, что вы делаете лендинг для вашего проекта или поднимаете инвестиции. Как бы вы описали его одной фразой, чтобы он выделялся среди всех остальных?</h2><div class="answer">Образование - как туалетная бумага: нужно всем и всегда. Только мы сделали так, чтобы дети сами хотели им пользоваться</div></section><section class="qa"><h2>Что и как делает ваш агент?</h2><div class="answer">«Памагочи» — голосовой ИИ-учитель для младших школьников. Ребёнок общается с живым персонажем, решает игровые задания, получает подсказки вместо готовых ответов, а система запоминает, что уже освоено, где он ошибается и как ему удобнее учиться. Учитель видит прогресс, назначает задания и контролирует сгенерированный контент.
Внешний цикл
1. Ребёнок выбирает занятие и разговаривает с персонажем голосом или текстом.
2. Памагочи объясняет одну небольшую тему и даёт конкретное задание.
3. Ребёнок отвечает, система сразу проверяет результат.
4. При ошибке агент не выдаёт ответ, а упрощает объяснение или даёт подсказку.
5. Результат меняет карту знаний: что освоено, что требует практики и что можно открыть дальше.
6. На следующем занятии агент продолжает с того места, где ребёнок остановился.
Учитель при этом может видеть трудности ребёнка, составлять учебный план и публиковать новые наборы заданий.
Внутренний цикл агента
Перед занятием агент загружает педагогические правила, программу, профиль ребёнка, локальный прогресс и краткую выжимку из долговременной памяти. Во время занятия речь распознаёт Deepgram, DeepSeek выбирает объяснение и при необходимости вызывает инструменты памяти и прогресса, ElevenLabs озвучивает ответ, а LiveKit связывает браузер и голосового агента.
После каждого содержательного ответа система фиксирует конкретный навык и результат: correct или needs_practice. В конце занятия сохраняется краткий итог — что получилось, где возникла трудность, каким было настроение и с чего лучше начать в следующий раз.
Как устроена память
У памяти два слоя:
- Локальная структурированная память — точный источник истины. В ней находятся результаты заданий, число попыток, статусы тем, освоенные навыки и история занятий. По ней строится карта знаний.
- xmemory — долговременный смысловой контекст: интересы ребёнка, предпочтительный способ объяснения, устойчивые ошибки, наблюдения, итоги уроков и назначения учителя.
Полные аудиозаписи и транскрипты в учебную память не складываются. Данные разделяются по идентификатору ученика, а учитель может посмотреть и адресно удалить конкретные записи.

агент пока не переобучает сам себя и не изменяет собственный код или модель. Под автоулучшением у нас понимается автоматическая адаптация учебного процесса.
Система накапливает результаты ребёнка, выделяет проблемные микронавыки, возвращается к устойчивым ошибкам, меняет сложность и форму объяснения, использует интересы ребёнка в примерах и не заставляет повторять уже освоенное. То есть улучшается не базовая модель, а персональная стратегия обучения конкретного ребёнка.

Полноценных образовательных эвалов у проекта сейчас нет.</div></section><section class="qa"><h2>Про технический и AI стек</h2><div class="answer">Движок памяти
Мы выбрали xmemory, но используем его вместе с локальной структурированной памятью.
- Локальный JSON хранит точные результаты: задания, попытки, статусы тем и освоенные навыки.
- xmemory хранит долговременный контекст: интересы ребёнка, устойчивые ошибки, итоги занятий, назначения учителя и динамику по навыкам.
Что понравилось: типизированные объекты и связи вместо бесконтрольного текстового RAG, возможность обновить или удалить конкретный факт, построить персональный бриф перед уроком и сохранить историю изменений.
Что не понравилось: внешний сервис добавляет задержки, сетевые ошибки и ограничения по запросам. Кроме того, два слоя памяти приходится синхронизировать. Поэтому xmemory работает в режиме best effort: если оно недоступно, урок продолжается на локальных данных. Сам локальный JSON удобен для MVP, но для production потребуется транзакционная база данных.
Модели
- LLM — DeepSeek Chat. Семейство модели open-weight, но в проекте она используется через внешний API.
- STT — Deepgram Nova-3 для потокового распознавания русской речи.
- TTS — ElevenLabs Flash v2.5 для озвучивания ответов.
У DeepSeek мы намеренно отключили reasoning/thinking: в голосовом продукте ребёнку важнее получить короткий ответ быстро, чем ждать длинного внутреннего рассуждения. Модель ограничена короткими репликами и вызывает инструменты для записи прогресса и памяти.

Остальные компоненты
- LiveKit Agents — голосовая сессия, аудио, текст, транскрипция и события между интерфейсом и агентом.
- Next.js 15, React 19 и TypeScript — веб-приложение ученика, панели учителя и администратора.
- Rive — анимированный персонаж и его состояния: слушает, думает, говорит, радуется.
- Zod — проверка конфигурации, инструментов агента и сгенерированных заданий.
- Vitest, ESLint, TypeScript и production build — технические проверки проекта.</div></section><section class="qa"><h2>Если бы у вас была ещё одна неделя, что бы вы сделали в первую очередь и почему именно это?</h2><div class="answer">Проработал бы лучше историю с памятью! Сейчас она слабовата, нет уверенности, что агент сохранит ее, нет уверенности, что будет получено то что надо.</div></section><section class="qa"><h2>Какие решения оправдали себя настолько, что вы бы рекомендовали другим командам их переиспользовать? Например: паттерн реализации, выбор технологии, архитектурное решение, продуктовая идея.</h2><div class="answer">Наверное только аватар от Rive. Остальное мне кажется технически еще далеко до совершенства! </div></section><section class="qa"><h2>Какие решения оказались неудачными или не дали ожидаемой пользы?</h2><div class="answer">Elevenlabs по прежнему плохо работает с числами, и когда происходят действия с умножениями, просто может уйти в цикл!</div></section><section class="qa"><h2>Пример работы агента до и после обучения</h2><div class="answer">Есть подробное описание в github. Видео могу приложить в чат.</div></section><section class="qa"><h2>Участвуете ли вы в номинации от xmemory?</h2><div class="answer">Да</div></section></main></body></html></template>

    <h2>1. Анализ</h2>

    <h3>1.1. Пошаговый пайплайн</h3>
    <table>

    <p class="muted">Диаграмма отражает составные состояния задачи и её набора; в коде нет единого enum со всеми этими значениями.</p>

    Решена --> Следующая_задача
    Следующая_задача --> Показана
    Решена --> Набор_завершён
    Набор_завершён --> [*]</pre>

    <h3>1.2. Как воспроизвести</h3>
    <ol>
      <li>Нужны Node.js 22+, pnpm 9+ и аккаунты LiveKit Cloud, Deepgram, DeepSeek и ElevenLabs.</li>
      <li>Выполнить <code>pnpm install</code>.</li>
      <li>Скопировать <code>.env.example</code> в <code>.env.local</code> и заполнить серверные ключи провайдеров и <code>ELEVENLABS_VOICE_ID</code>. Для долгосрочной памяти дополнительно задать <code>XMEM_API_KEY</code> и <code>XMEM_INSTANCE_ID</code>.</li>
      <li>Для XMemory сначала посмотреть план <code>pnpm memory:schema</code>, затем применить <code>pnpm memory:schema -- --apply</code> и загрузить curriculum командой <code>pnpm memory:curriculum</code>.</li>
      <li>Запустить web и voice worker одной командой <code>pnpm dev:all</code>, открыть <code>http://localhost:3000</code>, разрешить микрофон и начать урок.</li>
      <li>Для проверки выполнить <code>pnpm test</code> и <code>pnpm typecheck</code>; живой XMemory проверяется отдельно командой <code>pnpm test:xmemory</code>.</li>
    </ol>
    <p class="sources"><strong>Источники:</strong> <a href="https://github.com/podlodka-ai-club/level-up/blob/92bee22744457ec494db848cd6ade261259f7861/README.md">README.md</a>, <a href="https://github.com/podlodka-ai-club/level-up/blob/92bee22744457ec494db848cd6ade261259f7861/.env.example">.env.example</a>, <a href="https://github.com/podlodka-ai-club/level-up/blob/92bee22744457ec494db848cd6ade261259f7861/docs/xmemory.md#L45-L87">docs/xmemory.md</a>, <a href="https://github.com/podlodka-ai-club/level-up/blob/92bee22744457ec494db848cd6ade261259f7861/package.json">package.json</a>. В исследованной копии реально прошли 148/148 unit-тестов (22 файла) и обе TypeScript-проверки; live E2E с внешними сервисами не запускался.</p>

    <h3>1.3. Технический стек</h3>
    <ul>
      <li><strong>Агенты:</strong> LiveKit Agents voice worker; один репетитор «Пама» с вариантами поведения <code>strict</code>/<code>lenient</code>.</li>
      <li><strong>LLM:</strong> DeepSeek через OpenAI-compatible LiveKit plugin; <code>deepseek-chat</code> по умолчанию; thinking отключён.</li>
      <li><strong>Внешние интеграции:</strong> LiveKit Cloud, Deepgram STT, ElevenLabs TTS, DeepSeek API, XMemory.</li>
      <li><strong>Память:</strong> локальные атомарные JSON-файлы + удалённый структурированный XMemory instance на класс; JSONL-история диалогов.</li>
      <li><strong>Эвалы:</strong> Vitest unit/integration tests и отдельный live XMemory E2E; продольной оценки качества обучения нет.</li>
      <li><strong>Фреймворки:</strong> Next.js 16, React 19, TypeScript, Zod, Tailwind CSS 4, Motion, Rive, pnpm.</li>
    </ul>
    <p class="sources"><strong>Источники:</strong> <a href="https://github.com/podlodka-ai-club/level-up/blob/92bee22744457ec494db848cd6ade261259f7861/package.json">package.json</a>, <a href="https://github.com/podlodka-ai-club/level-up/blob/92bee22744457ec494db848cd6ade261259f7861/agent/package.json">agent/package.json</a>, <a href="https://github.com/podlodka-ai-club/level-up/blob/92bee22744457ec494db848cd6ade261259f7861/agent/src/providers.ts">agent/src/providers.ts</a>, <a href="https://github.com/podlodka-ai-club/level-up/tree/92bee22744457ec494db848cd6ade261259f7861/xmemory">xmemory/</a>.</p>
  </section>

  <section>
    <h2>2. Ответы на вопросы</h2>

    <h3>1. С какими задачами работает агент?</h3>
    <p class="answer">Агент ведёт младшего школьника по учебным темам curriculum, проверяет экранные и разговорные ответы и запоминает личный контекст. Основной путь выбора — первый незавершённый опубликованный набор из плана учителя; вне него prompt предлагает темы с закрытыми пререквизитами и навыки для повторения.</p>
    <ul class="sources"><li><strong>Факт:</strong> назначения бывают для класса или ученика, с порядком, сроком и флагом скрытия — <a href="https://github.com/podlodka-ai-club/level-up/blob/92bee22744457ec494db848cd6ade261259f7861/lib/classroom.ts#L33-L45">lib/classroom.ts</a>.</li><li><strong>Факт:</strong> <code>nextIncompleteAssignment</code> берёт первый набор, где есть задача без результата <code>correct</code> — <a href="https://github.com/podlodka-ai-club/level-up/blob/92bee22744457ec494db848cd6ade261259f7861/lib/classroom.ts#L119-L145">lib/classroom.ts</a>.</li></ul>

    <h3>2. Как агент выбирает, что сохранить в память?</h3>
    <p class="answer">Prompt требует сохранять новый или изменившийся личный факт и каждый учебный ответ, включая ошибку; обычная болтовня и уже известный неизменившийся факт не записываются. В XMemory отдельное наблюдение создаётся только для полезного сигнала: ошибки, заблуждения или ответа с подсказкой.</p>
    <ul class="sources"><li><strong>Критерии:</strong> интересы, цели, страхи, предпочтения и жизненные события идут через <code>remember_facts</code>; учебный ответ — через ровно один из <code>record_lesson_task</code>/<code>record_progress</code> — <a href="https://github.com/podlodka-ai-club/level-up/blob/92bee22744457ec494db848cd6ade261259f7861/agent/src/prompt.ts#L129-L134">agent/src/prompt.ts</a>.</li><li><strong>Фильтр шума:</strong> обычные правильные примеры не создают <code>LearningObservation</code> — <a href="https://github.com/podlodka-ai-club/level-up/blob/92bee22744457ec494db848cd6ade261259f7861/docs/xmemory.md#L115-L128">docs/xmemory.md</a>.</li></ul>

    <h3>3. Как организована память между рестартами агента?</h3>
    <p class="answer">Память двухслойная: точный прогресс хранится локально в атомарном JSON, а долгосрочный смысловой контекст — в удалённом XMemory. Один XMemory instance обслуживает класс, а записи изолируются стабильным <code>student_external_id</code>.</p>
    <ul class="sources"><li><strong>Локально:</strong> <code>.data/students/&lt;studentId&gt;/learning-state.json</code> хранит факты, темы, задачи и сессии — <a href="https://github.com/podlodka-ai-club/level-up/blob/92bee22744457ec494db848cd6ade261259f7861/docs/xmemory.md#L9-L17">docs/xmemory.md</a>.</li><li><strong>XMemory:</strong> схема содержит <code>Student</code>, <code>KnowledgeState</code>, <code>LearningObservation</code>, <code>LessonSession</code>, <code>PersonalMemory</code> и <code>TeacherAssignment</code> — <a href="https://github.com/podlodka-ai-club/level-up/blob/92bee22744457ec494db848cd6ade261259f7861/xmemory/classroom-schema.yml">xmemory/classroom-schema.yml</a>.</li></ul>

    <h3>4. Как агент обучается и меняет поведение?</h3>
    <p class="answer">Он не дообучает LLM и не меняет код: поведение адаптируется через обновлённый <code>KnowledgeState</code>, интервалы повторения, назначения и личные факты, которые заново входят в system prompt. Порог освоения детерминирован: три правильных ответа подряд дают <code>mastered</code>, ошибка возвращает навык к практике.</p>
    <ul class="sources"><li><strong>Алгоритм:</strong> статусы, streak, confidence и review ladder <code>[1,2,4,7,14,30]</code> рассчитываются без LLM — <a href="https://github.com/podlodka-ai-club/level-up/blob/92bee22744457ec494db848cd6ade261259f7861/agent/src/memory/mutations.ts#L81-L140">memory/mutations.ts</a>.</li><li><strong>Применение:</strong> бриф памяти помещается в конец инструкций и определяет первый ход репетитора — <a href="https://github.com/podlodka-ai-club/level-up/blob/92bee22744457ec494db848cd6ade261259f7861/agent/src/prompt.ts#L42-L55">agent/src/prompt.ts</a>.</li></ul>

    <h3>5. Как память обновляется?</h3>
    <p class="answer">Агрегат навыка обновляется на каждой попытке, а доказательства обучения сохраняются append-only выборочно. Новая версия личного факта помечает старую как <code>superseded</code>; автоматического TTL или забывания по возрасту не описано.</p>
    <ul class="sources"><li><strong>Устаревание:</strong> superseded-запись остаётся для аудита, но исключается из рабочего брифа — <a href="https://github.com/podlodka-ai-club/level-up/blob/92bee22744457ec494db848cd6ade261259f7861/agent/src/memory/mutations.ts#L305-L312">memory/mutations.ts</a>.</li><li><strong>Очистка:</strong> есть dry-run/apply-компактация старых фактов и ручные операции учителя «забыть выбранное», wipe XMemory и reset everywhere — <a href="https://github.com/podlodka-ai-club/level-up/blob/92bee22744457ec494db848cd6ade261259f7861/scripts/xmemory-compaction.ts">xmemory-compaction.ts</a>, <a href="https://github.com/podlodka-ai-club/level-up/tree/92bee22744457ec494db848cd6ade261259f7861/app/api/teacher/students/%5BstudentId%5D/memory">memory API</a>.</li></ul>

    <h3>6. Как работают эвалы?</h3>
    <p class="answer"><strong>Продольные эвалы улучшения агента в репозитории не найдены.</strong> Есть автоматические тесты правил, prompt, памяти и отказоустойчивости, а также отдельный live E2E XMemory, но они проверяют корректность реализации, не рост качества обучения со временем.</p>
    <ul class="sources"><li><strong>Локально:</strong> <code>pnpm test</code> запускает Vitest; на исследованном commit прошли 148/148 тестов — <a href="https://github.com/podlodka-ai-club/level-up/blob/92bee22744457ec494db848cd6ade261259f7861/package.json">package.json</a>, <a href="https://github.com/podlodka-ai-club/level-up/tree/92bee22744457ec494db848cd6ade261259f7861/agent/src">agent/src/*test.ts</a>.</li><li><strong>Live:</strong> <code>pnpm test:xmemory</code> создаёт временного ученика и проверяет lookup, связи, агрегацию, смену состояния и cleanup — <a href="https://github.com/podlodka-ai-club/level-up/blob/92bee22744457ec494db848cd6ade261259f7861/scripts/xmemory-edu-test.ts">xmemory-edu-test.ts</a>.</li></ul>

    <h3>7. Как работает human in the loop?</h3>
    <p class="answer">Человек подключён в двух ролях: ребёнок даёт ответы и личные вводные, а учитель контролирует программу и память. Учитель создаёт/редактирует/публикует/назначает задания, добавляет заметки и может исправлять или удалять записи памяти.</p>
    <ul class="sources"><li><strong>Контроль заданий:</strong> сгенерированный DeepSeek набор сохраняется только как <code>draft</code> и публикуется отдельным действием — <a href="https://github.com/podlodka-ai-club/level-up/blob/92bee22744457ec494db848cd6ade261259f7861/app/api/teacher/task-sets/generate/route.ts">generate/route.ts</a>, <a href="https://github.com/podlodka-ai-club/level-up/blob/92bee22744457ec494db848cd6ade261259f7861/app/api/teacher/task-sets/%5BtaskSetId%5D/publish/route.ts">publish/route.ts</a>.</li><li><strong>Контроль памяти:</strong> teacher API пишет профиль/заметку и журналирует результат как <code>complete</code>, <code>partial</code> или <code>failed</code> — <a href="https://github.com/podlodka-ai-club/level-up/blob/92bee22744457ec494db848cd6ade261259f7861/app/api/teacher/students/%5BstudentId%5D/memory/route.ts">memory/route.ts</a>.</li></ul>

    <h3>8. Используется ли xmemory?</h3>
    <p class="answer">Да. XMemory хранит долгосрочный профиль ученика, агрегированное владение навыками, значимые наблюдения, итоги уроков, личные факты и назначения; при старте из него строится lesson brief.</p>
    <ul class="sources"><li><strong>Подключение:</strong> слой включается только при наличии обеих переменных <code>XMEM_API_KEY</code> и <code>XMEM_INSTANCE_ID</code>, иначе система работает локально — <a href="https://github.com/podlodka-ai-club/level-up/blob/92bee22744457ec494db848cd6ade261259f7861/.env.example#L43-L49">.env.example</a>.</li><li><strong>Сценарии:</strong> чтение перед уроком, асинхронные структурные записи после ответов, recall по запросу, teacher notes и адресное удаление — <a href="https://github.com/podlodka-ai-club/level-up/blob/92bee22744457ec494db848cd6ade261259f7861/docs/xmemory.md">docs/xmemory.md</a>, <a href="https://github.com/podlodka-ai-club/level-up/blob/92bee22744457ec494db848cd6ade261259f7861/agent/src/xmemory.ts">agent/src/xmemory.ts</a>.</li></ul>

    <h3>9. Сбои во время выполнения задачи</h3>
    <p class="answer">Критический прогресс экранного урока сохраняется локально, поэтому отказ XMemory не останавливает ответ ребёнку. Ошибки памяти логируются; rate limit повторяется с backoff, конфликты create/update «лечатся» сменой мутации, а исчерпанная квота не ретраится.</p>
    <ul class="sources"><li><strong>Retry:</strong> максимум два повтора 429 с учётом <code>Retry-After</code>, общий цикл — до шести попыток — <a href="https://github.com/podlodka-ai-club/level-up/blob/92bee22744457ec494db848cd6ade261259f7861/agent/src/memory/write-retry.ts">write-retry.ts</a>.</li><li><strong>Деградация:</strong> при недоступном брифе агент продолжает с локальным состоянием; при завершении ограниченно дренирует очередь — <a href="https://github.com/podlodka-ai-club/level-up/blob/92bee22744457ec494db848cd6ade261259f7861/agent/src/main.ts">main.ts</a>, <a href="https://github.com/podlodka-ai-club/level-up/blob/92bee22744457ec494db848cd6ade261259f7861/docs/xmemory.md#L88-L107">docs/xmemory.md</a>.</li></ul>

    <h3>10. Мониторинг</h3>
    <p class="answer">Есть подробное локальное JSONL-логирование каждой голосовой сессии, но внешняя observability-платформа или алерты не описаны. По логам можно восстановить транскрипты, ответы, переходы состояния, вызовы инструментов с аргументами/результатами и ошибками; внутреннюю цепочку рассуждений LLM восстановить нельзя.</p>
    <ul class="sources"><li><strong>События:</strong> tool calls, transcripts, replies, metrics, usage, agent state и errors записываются в <code>.data/dialogues/&lt;studentId&gt;/*.jsonl</code> — <a href="https://github.com/podlodka-ai-club/level-up/blob/92bee22744457ec494db848cd6ade261259f7861/agent/src/dialogue-log.ts">dialogue-log.ts</a>.</li><li><strong>Аналитика:</strong> <code>scripts/dialogue-stats.ts</code> считает median/p90/max загрузки XMemory-брифа и карточки, а также долю промахов/таймаутов — <a href="https://github.com/podlodka-ai-club/level-up/blob/92bee22744457ec494db848cd6ade261259f7861/scripts/dialogue-stats.ts">dialogue-stats.ts</a>.</li></ul>
  </section>

      <ul>
        <li>В репозитории не найдено измерение того, что педагогическое качество или успешность ученика улучшаются от версии к версии.</li>
        <li>Не описаны production-развёртывание, внешние алерты, SLO и централизованный tracing.</li>
