</style></head><body><main><h1>Uptick — анкета команды </h1><div class="meta">Репозиторий: <a href="https://github.com/podlodka-ai-club/uptick" target="_blank" rel="noopener">https://github.com/podlodka-ai-club/uptick</a> · ответ отправлен 07.09.2026 21:15:07</div><section class="qa"><h2>Представьте, что вы делаете лендинг для вашего проекта или поднимаете инвестиции. Как бы вы описали его одной фразой, чтобы он выделялся среди всех остальных?</h2><div class="answer">Uptick — AI-инженеры, которые учатся на авариях в нашем симуляторе, накапливают опыт и осваивают главное искусство SRE: держать сервис доступным без лишних расходов на инфраструктуру.</div></section><section class="qa"><h2>Что и как делает ваш агент?</h2><div class="answer">AK2 — агент, который осваивает новую среду, сам создаёт инструменты для работы с ней и накапливает опыт между запусками. Мы проверяли его на SRE-задаче: поддерживать доступность веб-сервиса не ниже 99% при минимальных расходах на инфраструктуру. Агент управляет серверами, диагностирует перегрузки, настраивает firewall, очищает диски и выполняет миграции базы данных.
При подключении мира человек задаёт его описание и начальную команду. Агент получает документацию API, изучает доступные действия и самостоятельно создаёт адаптер, скрипты, инструкции и промпт для этой среды. Интеграция проходит проверки перед использованием. Универсальное ядро не содержит готовой стратегии прохождения SRE-сценариев; решения об инфраструктуре принимает модель. Возможность подключить другую среду мы дополнительно проверили на небольшом симуляторе кухни.
Внутренний цикл устроен так: агент получает наблюдение, извлекает подходящий опыт, сопоставляет состояние с целью и текущим планом, выбирает действия и проверяет их фактический результат. Успешный ответ API и достижение цели учитываются отдельно: например, создание сервера ещё не означает устранение перегрузки. Очередь действий, идентификаторы запросов и состояние сохраняются, чтобы после остановки продолжить работу без повторного выполнения уже подтверждённых операций.
Память разделена на три слоя:
- Рабочая память: цель, план, последние наблюдения и незавершённые действия.
- Знание мира: документация, адаптеры и инструкции, описывающие способы взаимодействия со средой.
- Приобретённый опыт: условные уроки и процедуры в SQLite, связанные с конкретными фактами, подтверждениями и противоречиями.
У каждого мира собственная память. При выборе уроков учитываются релевантность, важность и накопленные подтверждения. Повторно подтверждённые процедуры становятся навыками, слабые записи постепенно теряют вес и могут удаляться. Само использование урока не считается доказательством его правильности.
Внешний цикл улучшения работает через осмысление опыта. Агент сопоставляет ожидаемый и наблюдаемый результат, предлагает новые уроки или фиксирует противоречия существующим. Перед записью отдельный вызов модели проверяет, достаточно ли исходных фактов для такого вывода. Повторное чтение одного события не создаёт нового подтверждения, а изменение смысла урока требует новой записи. После завершения или остановки запуска агент выполняет ретроспективу по сохранённой истории. Если ему не хватает способа наблюдения или действия, он может самостоятельно расширить инструменты выбранного мира. Обучение происходит на уровне памяти и средств работы, без изменения весов модели.
Данные для обучения мы получаем в собственном симуляторе, также разработанном в рамках хакатона. Он генерирует воспроизводимые сценарии нагрузки, DDoS, заполнения дисков и других инфраструктурных событий. Опыт формируется из реальных взаимодействий агента с этой средой: наблюдений, действий и их последствий.
Например, в одном запуске агент обнаружил, что общего запаса мощности недостаточно: отдельный запрос должен помещаться в свободную мощность конкретного backend. Он сохранил этот урок, а в другом запуске применил его для расчёта необходимого числа серверов. После расширения обе проверяемые страницы стали отвечать успешно.
Для оценки реализовано парное сравнение на новых seed: одинаковые инструменты и знание протокола, но одна группа получает накопленный опыт, а другая работает без него; обучение на время оценки отключается. Перенос конкретных уроков между запусками уже подтверждён. Для количественной оценки среднего выигрыша от памяти ещё требуется завершённая серия таких сравнений на неизменной версии системы.</div></section><section class="qa"><h2>Про технический и AI стек</h2><div class="answer">Основное ядро AK2 написано на Python 3.12+. Для управления зависимостями используем uv, для HTTP-взаимодействия — httpx, для типизации и проверки решений модели — Pydantic. Модель возвращает структурированный ответ с оценкой ситуации, планом, действиями и предложениями обновить память. Собственное агентное ядро позволяет отдельно менять модель, память и интеграцию с миром.
Для работы с LLM используем Codex SDK (openai-codex) через авторизацию ChatGPT. Основная модель — gpt-5.6-sol с reasoning effort low. В ходе экспериментов также пробовали Luna и Spark. Это закрытые модели; открытые модели и дообучение весов в текущей реализации не использовали. Sol стала практическим выбором по результатам разработки, хотя строгого сравнительного рейтинга моделей мы не проводили. Повышение reasoning effort само по себе не устраняло неэффективные стратегии, а большое число обращений к модели заметно увеличивало время прохождения.
Движок памяти — собственная реализация на SQLite. В ней хранятся события, факты, уроки, процедуры, подтверждения, противоречия и история изменений. Поиск основан на лексической релевантности, важности и силе урока; embeddings и векторную БД пока не использовали. SQLite оказалась удобна своей прозрачностью: можно проследить происхождение вывода, проверить его основания и воспроизвести состояние памяти. Ограничение такого подхода — лексический поиск хуже учитывает смысловую близость разных формулировок.
Обновления памяти проходят отдельную проверку моделью по исходным доказательствам. Есть дедупликация фактов, привязка подтверждений к конкретной формулировке урока, затухание и забывание. Такой подход помогает не превращать любой успешный ответ API в «выученный навык». При этом проверяющая модель тоже может ошибаться, а качество обучения сильно зависит от полноты фактов, которые предоставляет адаптер.
Инструменты работы с миром агент генерирует как Python-скрипты и сопровождает инструкциями. Они выполняются в системной песочнице: sandbox-exec на macOS или bubblewrap на Linux. Используем версии интеграций, сохранение очереди действий и идемпотентные запросы для восстановления после остановок. Это помогло продолжать длинные эксперименты; сложностями стали длительная генерация адаптеров, большой контекст и обработка неполных HTTP-ответов.
Симулятор тоже разработан нами в рамках хакатона. Его стек — Go, HTTP/JSON API, OpenAPI, SQLite, журнал событий и сжатые zstd-снимки состояния. Интерфейс наблюдения и истории сделан на HTML/CSS/JavaScript. Детерминированная генерация по seed и сохранение событий позволяют повторять сценарии и разбирать причины неудач.
Для обучения и эвалов используем собственный экспериментальный контур: серии запусков, новые seed для проверки, замороженные инструменты и память, парное сравнение с опытом и без него. Измеряем доступность, игровые расходы, число решений и время работы модели. Главное ограничение текущих результатов — во время разработки менялись и агент, и симулятор, поэтому количественный эффект памяти ещё нужно подтвердить на фиксированной версии всей системы.</div></section><section class="qa"><h2>Если бы у вас была ещё одна неделя, что бы вы сделали в первую очередь и почему именно это?</h2><div class="answer">Если бы у нас была ещё неделя, мы бы в первую очередь замкнули и проверили цикл обучения: от конкретной ошибки до изменения поведения в следующем запуске. Агент уже умеет осваивать интерфейс среды, управлять инфраструктурой и переносить отдельные уроки между запусками. Следующий шаг — добиться устойчивого предотвращения повторных ошибок и измерить пользу памяти.
Для этого мы бы разобрали причины отклонения новых уроков, проверили их извлечение и применение, затем провели парные эксперименты с памятью и без неё на новых сценариях. Версии симулятора, агента, модели и начальные условия были бы зафиксированы. Помимо доступности и расходов на инфраструктуру, учитывали бы время и стоимость работы модели.
Этот приоритет позволил бы понять, какие механизмы действительно улучшают результат, и направить дальнейшую разработку на подтверждённые проблемы.</div></section><section class="qa"><h2>Какие решения оправдали себя настолько, что вы бы рекомендовали другим командам их переиспользовать? Например: паттерн реализации, выбор технологии, архитектурное решение, продуктовая идея.</h2><div class="answer">Мы бы рекомендовали переиспользовать несколько решений, которые оказались полезны при разработке и реальных прогонах.
1. Разделять знание интерфейса и приобретённый опыт. В AK2 документация, адаптеры и инструкции описывают, как взаимодействовать с миром, а память хранит условные выводы о том, какие действия срабатывали и при каких обстоятельствах. Это позволяет обновлять интеграцию независимо от опыта и корректно сравнивать агента с памятью и без неё.
2. Хранить уроки вместе с доказательствами. У каждого урока есть исходные факты, условия применимости, подтверждения и противоречия. Повторное чтение события не усиливает урок, а изменение его смысла требует нового кандидата. Такая память позволяет разбирать причины решений и замечать необоснованные обобщения. Отдельная проверка моделью полезна как дополнительный фильтр, хотя тоже требует контроля качества.
3. Различать принятие команды, завершение операции и достижение цели. Успешный ответ API ещё не означает, что проблема решена. Например, после создания сервера нужно дождаться его готовности и проверить восстановление доступности. Этот паттерн особенно полезен для агентов, работающих с асинхронными инструментами.
4. Сохранять состояние до выполнения действий. Мы сохраняем план, очередь, идентификаторы запросов и подтверждённые результаты. Вместе с идемпотентностью API это позволило продолжать длинные запуски после остановок и исправлений, сохраняя уже выполненную работу.
5. Использовать воспроизводимый симулятор с подробной историей. Собственная среда с генерацией по seed, версиями сценариев и журналом событий оказалась полезна и для обучения, и для диагностики. По истории можно установить, какое действие привело к простою или перерасходу, и отделить ошибку агента от ограничения самого стенда.
6. Начать с прозрачной реализации памяти и строгих контрактов. SQLite дала удобное хранение и возможность напрямую исследовать опыт агента. Типизированные ответы модели через Pydantic помогли отделить рассуждение от исполнения и проверять формат действий до обращения к среде. Для экспериментального проекта эта наблюдаемость оказалась особенно ценной.</div></section><section class="qa"><h2>Какие решения оказались неудачными или не дали ожидаемой пользы?</h2><div class="answer">Доверять самооценке модели при накоплении памяти. Модель может убедительно сформулировать урок, который не следует из наблюдений. Сохранение таких выводов закрепляет ошибки. Нам понадобились исходные доказательства, условия применимости, учёт противоречий и отдельная проверка предложений. При этом ещё один вызов LLM тоже не гарантирует правильность.

Делать отдельный вызов модели для каждого небольшого действия. Такой цикл легко реализовать и отлаживать, но на длинных задачах он становится медленным и дорогим. Полезнее давать модели выбирать план, а механические последовательности выполнять инструментом с проверками и понятными условиями остановки.

Ожидать, что более глубокое рассуждение исправит недостатки системы. Повышение reasoning effort не дало автоматического улучшения стратегии. Если агенту не хватает наблюдений, удобных инструментов или проверки результата, дополнительное рассуждение не устраняет эти ограничения.

Недооценивать стоимость автоматически создаваемых инструментов. Генерация интеграции агентом работает, но может занимать несколько минут и требовать повторных исправлений. Её нужно учитывать как отдельный этап с бюджетом, проверками и версионированием, а готовые инструменты — переиспользовать между запусками.

Оценивать обучение по наличию памяти и отдельным удачным примерам. Количество записанных уроков, ссылки на них в решениях и убедительная ретроспектива ещё не показывают, что агент стал решать задачи лучше. Мы подтвердили применение отдельных уроков, но для оценки общего эффекта нужны контрольные запуски с одинаковыми условиями. Одновременные изменения модели, промптов, инструментов и среды сильно затрудняют такой вывод.</div></section><section class="qa"><h2>Пример работы агента до и после обучения</h2><div class="answer">https://github.com/podlodka-ai-club/uptick/blob/main/reports/ak2-learning-report.html</div></section><section class="qa"><h2>Участвуете ли вы в номинации от xmemory?</h2><div class="answer">Нет</div></section></main></body></html></template>

  <h3>1.2. Как воспроизвести</h3>
  <h4>Минимальный baseline (<code>simple_agent</code>)</h4>

    <li>Запустить <code>uv run uptick-agent run --seed 1</code>. Для локального симулятора добавить <code>--simulator-url http://127.0.0.1:8080</code>.</li>
    <li>Проверить код: <code>uv run pytest</code> и <code>uv run ruff check .</code>.</li>
  </ol>
  <p>Источник: <a href="https://github.com/podlodka-ai-club/uptick/blob/4767438d24e281dcf88c590778f2c6705ec1f3ef/simple_agent/README.md#быстрый-старт">simple_agent/README.md</a>.</p>

  <h4>Основной универсальный агент (<code>ak2-agent</code>)</h4>
  <ol>
    <li>Установить Python 3.12+, <code>uv</code>, Codex CLI/SDK; на macOS нужен <code>sandbox-exec</code>, на Linux — <code>bubblewrap</code> и user namespaces.</li>

    <li>После паузы продолжить: <code>./run.sh resume --world uptick</code>; память посмотреть через <code>./run.sh memory --world uptick</code>.</li>

<section>
  <h2>2. Ответы на вопросы</h2>

  <h3>1. С какими задачами работает агент?</h3>
  <p class="answer">AK2 работает с задачами миров, описанных паспортами <code>worlds/*/AGENTS.md</code>: сейчас это, в частности, Uptick SRE и учебный Pantry. Задачу передаёт человек через CLI/JSONL; мир выбирается явно либо маршрутизируется моделью по тексту.</p>
  <ul class="facts"><li><a href="https://github.com/podlodka-ai-club/uptick/blob/4767438d24e281dcf88c590778f2c6705ec1f3ef/ak2-agent/README.md#подключить-неизвестный-мир">Паспорт и выбор мира</a>.</li><li><a href="https://github.com/podlodka-ai-club/uptick/blob/4767438d24e281dcf88c590778f2c6705ec1f3ef/ak2-agent/README.md#поток-задач">JSONL stream</a>.</li><li><a href="https://github.com/podlodka-ai-club/uptick/blob/4767438d24e281dcf88c590778f2c6705ec1f3ef/ak-agent/README.md#как-устроен-код">AK-агент специализирован на SRE API v2</a>.</li></ul>

  <h3>2. Как агент выбирает, что сохранить в память?</h3>
  <p class="answer">Предложение LLM записывается как урок только с существующими evidence ID нужного outcome и после отдельной проверки <code>verify_lesson</code>; отсутствие, несоответствие, слабость или повтор доказательства закрывают запись. Долговременным уроком/навыком кандидат становится после минимум трёх подтверждений при доверии не ниже 75%.</p>
  <ul class="facts"><li><a href="https://github.com/podlodka-ai-club/uptick/blob/4767438d24e281dcf88c590778f2c6705ec1f3ef/ak2-agent/src/ak2_agent/learning.py">Fail-closed проверка урока</a>.</li><li><a href="https://github.com/podlodka-ai-club/uptick/blob/4767438d24e281dcf88c590778f2c6705ec1f3ef/ak2-agent/src/ak2_agent/memory.py#L235-L311">дедупликация, confidence и уровни</a>.</li><li><a href="https://github.com/podlodka-ai-club/uptick/blob/4767438d24e281dcf88c590778f2c6705ec1f3ef/ak2-agent/README.md#как-формируется-опыт">таблица формирования опыта</a>.</li></ul>

  <h3>3. Как организована память между рестартами агента?</h3>
  <p class="answer">AK2 использует отдельную SQLite/WAL-базу каждого мира (<code>worlds/&lt;world&gt;/.local/experience.sqlite3</code>) и файловые каталоги run с pinned knowledge, I/O и checkpoint. В базе раздельно лежат состояния run, события, факты, запросы, уроки, подтверждения и журнал изменений; <code>resume</code> продолжает сохранённую очередь.</p>
  <ul class="facts"><li><a href="https://github.com/podlodka-ai-club/uptick/blob/4767438d24e281dcf88c590778f2c6705ec1f3ef/ak2-agent/README.md#два-разных-вида-памяти">структура per-world данных</a>.</li><li><a href="https://github.com/podlodka-ai-club/uptick/blob/4767438d24e281dcf88c590778f2c6705ec1f3ef/ak2-agent/src/ak2_agent/memory.py#L20-L53">SQLite-схема и WAL</a>.</li><li>Baseline отдельно предлагает постоянный <a href="https://github.com/podlodka-ai-club/uptick/blob/4767438d24e281dcf88c590778f2c6705ec1f3ef/simple_agent/README.md#память">JSONL backend</a>.</li></ul>

  <h3>4. Как агент обучается и меняет поведение?</h3>
  <p class="answer">Веса LLM не обучаются: агент превращает наблюдаемые исходы и ретроспективу в проверенные условные уроки/процедуры, а затем добавляет релевантные записи в контекст следующих решений. Отдельно AK2 способен адаптировать knowledge неизвестного мира, но прошлый опыт намеренно не подмешивается в базовые world skills.</p>
  <ul class="facts"><li><a href="https://github.com/podlodka-ai-club/uptick/blob/4767438d24e281dcf88c590778f2c6705ec1f3ef/ak2-agent/src/ak2_agent/agent.py#L537-L609">recall → решение → обучение → действие</a>.</li><li><a href="https://github.com/podlodka-ai-club/uptick/blob/4767438d24e281dcf88c590778f2c6705ec1f3ef/ak2-agent/src/ak2_agent/retrospective.py">послезапусковая ретроспектива</a>.</li><li><a href="https://github.com/podlodka-ai-club/uptick/blob/4767438d24e281dcf88c590778f2c6705ec1f3ef/ak-agent/README.md#обучение-и-эксперименты">явное указание: обучение внешней памяти без изменения весов</a>.</li></ul>

  <h3>5. Как память обновляется?</h3>
  <p class="answer">Подтверждения усиливают урок, противоречия снижают confidence, а отсутствие новых подтверждений экспоненциально уменьшает strength. AK2 удаляет слабые неважные уроки при strength &lt; 0,12, держит максимум 80 уроков и 100 завершённых разобранных run; удаление аудируется.</p>
  <ul class="facts"><li><a href="https://github.com/podlodka-ai-club/uptick/blob/4767438d24e281dcf88c590778f2c6705ec1f3ef/ak2-agent/src/ak2_agent/memory.py#L299-L380">decay, capacity, deletion и trim</a>.</li><li><a href="https://github.com/podlodka-ai-club/uptick/blob/4767438d24e281dcf88c590778f2c6705ec1f3ef/ak2-agent/README.md#журнал-изменений-памяти">неудаляемый журнал added/reinforced/contradicted/rejected/deleted</a>.</li><li>Автоматический пересмотр всех старых подкреплений после изменения мира <strong>не описан</strong>; README прямо отмечает, что ранее записанные подкрепления автоматически не пересматриваются.</li></ul>

  <h3>6. Как работают эвалы?</h3>
  <p class="answer"><code>evaluate</code> требует held-out seeds, фиксирует одну версию knowledge и создаёт для каждого seed/model две изолированные группы: с замороженным опытом и без него; обучение выключено в обеих. Сравниваются метрики мира, завершённость, решения и LLM-время, но одинаковый seed не устраняет стохастику модели и реального времени.</p>
  <ul class="facts"><li><a href="https://github.com/podlodka-ai-club/uptick/blob/4767438d24e281dcf88c590778f2c6705ec1f3ef/ak2-agent/src/ak2_agent/experiments.py">создание парных arms и results.json</a>.</li><li><a href="https://github.com/podlodka-ai-club/uptick/blob/4767438d24e281dcf88c590778f2c6705ec1f3ef/ak2-agent/README.md#L284-L300">ограничения парного evaluate</a>.</li><li>Baseline также сохраняет <a href="https://github.com/podlodka-ai-club/uptick/blob/4767438d24e281dcf88c590778f2c6705ec1f3ef/simple_agent/README.md#ab-прогоны"><code>trace.jsonl</code> и <code>summary.json</code></a>.</li></ul>

  <h3>7. Как работает human in the loop?</h3>
  <p class="answer">Человек задаёт паспорт/доверенный bootstrap нового мира, текст задачи, seed, опции и при необходимости явно выбирает мир; он может остановить, возобновить и инспектировать память/отчёт. Пооперационного согласования действий нет: после старта агент действует автономно, а sandbox и типизированные контракты — технические границы, не human approval.</p>
  <ul class="facts"><li><a href="https://github.com/podlodka-ai-club/uptick/blob/4767438d24e281dcf88c590778f2c6705ec1f3ef/ak2-agent/README.md#подключить-неизвестный-мир">человек задаёт описание и bootstrap</a>.</li><li><a href="https://github.com/podlodka-ai-club/uptick/blob/4767438d24e281dcf88c590778f2c6705ec1f3ef/ak2-agent/README.md#команды-из-ak-agent">run/resume/memory/ask/report</a>.</li><li>Недельный пример сопровождался исправлениями и возобновлениями, поэтому автономность неизменной версии <a href="https://github.com/podlodka-ai-club/uptick/blob/4767438d24e281dcf88c590778f2c6705ec1f3ef/ak2-agent/README.md#L7-L10">ещё не доказана серией полных запусков</a>.</li></ul>

  <h3>8. Используется ли xmemory?</h3>
  <p class="answer">В основном AK2 — нет: у него собственная SQLite-память. В изолированном варианте <code>vadim</code> есть опциональный экспериментальный адаптер HU-xiaobai/xMemory только для training: hybrid search даёт untrusted context, переходы пишутся через <code>add_messages</code>, finalize вызывает <code>flush</code>/<code>wait_for_semantic</code>.</p>
  <ul class="facts"><li><a href="https://github.com/podlodka-ai-club/uptick/blob/4767438d24e281dcf88c590778f2c6705ec1f3ef/vadim/docs/XMEMORY_INTEGRATION.md">полный контракт интеграции</a>.</li><li><a href="https://github.com/podlodka-ai-club/uptick/blob/4767438d24e281dcf88c590778f2c6705ec1f3ef/vadim/src/uptick_agent/integrations/xmemory/adapter.py">реализация адаптера</a>.</li><li>xMemory не добавлен как dependency; immutable snapshot для eval отсутствует, а полный upstream embedding/Chroma/BM25 pipeline и влияние на качество <a href="https://github.com/podlodka-ai-club/uptick/blob/4767438d24e281dcf88c590778f2c6705ec1f3ef/vadim/docs/XMEMORY_INTEGRATION.md#verification-performed">не проверены</a>.</li></ul>

  <h3>9. Сбои во время выполнения задачи</h3>
  <p class="answer">Состояние, очередь и request ID сначала фиксируются в SQLite; временные ошибки Codex переводят run в <code>recovering</code>, пересоздают соединение и продолжают с backoff из checkpoint. Потерянное действие повторяется только с прежним ID и только при <code>replay_safe</code>; небезопасный неоднозначный эффект сохраняется для ручного разбора/возобновления.</p>
  <ul class="facts"><li><a href="https://github.com/podlodka-ai-club/uptick/blob/4767438d24e281dcf88c590778f2c6705ec1f3ef/ak2-agent/src/ak2_agent/agent.py#L427-L483">recovery loop</a>.</li><li><a href="https://github.com/podlodka-ai-club/uptick/blob/4767438d24e281dcf88c590778f2c6705ec1f3ef/ak2-agent/src/ak2_agent/agent.py#L286-L320">безопасность повторов действий</a>.</li><li><a href="https://github.com/podlodka-ai-club/uptick/blob/4767438d24e281dcf88c590778f2c6705ec1f3ef/ak2-agent/README.md#L451-L468">backoff, восстановимые ответы и границы механизма</a>.</li><li>После Ctrl+C/SIGTERM checkpoint разбирается сразу; после SIGKILL следующий <code>resume</code> сначала завершает отложенную ретроспективу — <a href="https://github.com/podlodka-ai-club/uptick/blob/4767438d24e281dcf88c590778f2c6705ec1f3ef/ak2-agent/README.md#саморефлексия-после-каждой-остановки">описание остановок</a>.</li></ul>

  <h3>10. Мониторинг</h3>
  <p class="answer">Есть структурированный JSONL-вывод событий и постоянный SQLite-аудит: наблюдения, решения, действия/ответы, request ID, факты, LLM usage, ошибки восстановления, версии runtime и изменения уроков. Для новых run по этим данным можно восстановить последовательность действий и заявленное использование памяти; внутреннее chain-of-thought модели не сохраняется и не восстанавливается.</p>
  <ul class="facts"><li><a href="https://github.com/podlodka-ai-club/uptick/blob/4767438d24e281dcf88c590778f2c6705ec1f3ef/ak2-agent/src/ak2_agent/agent.py#L519-L615">события state/brain_usage/decision/action/completed</a>.</li><li><a href="https://github.com/podlodka-ai-club/uptick/blob/4767438d24e281dcf88c590778f2c6705ec1f3ef/ak2-agent/src/ak2_agent/memory.py#L28-L52">таблицы events/facts/requests/lesson_changes</a>.</li><li><a href="https://github.com/podlodka-ai-club/uptick/blob/4767438d24e281dcf88c590778f2c6705ec1f3ef/ak2-agent/README.md#журнал-изменений-памяти">аудит до/после и причины изменений</a>.</li><li>Для старых мигрированных run полнота ограничена: <a href="https://github.com/podlodka-ai-club/uptick/blob/4767438d24e281dcf88c590778f2c6705ec1f3ef/ak2-agent/src/ak2_agent/memory.py#L110-L125">удалённые ранее события не реконструируются</a>.</li></ul>
</section>

<section class="limits">
  <h2>Ограничения анализа</h2>
  <ul>
    <li>Анализ статический: реальные LLM-вызовы и полный внешний Uptick simulator не запускались.</li>
    <li>Репозиторий содержит независимые и частично экспериментальные реализации; корневой README перечисляет три основных агента, а <code>vadim</code> имеет собственную нормативную документацию. Единого production entrypoint для всех вариантов <strong>в репозитории не найдено</strong>.</li>
    <li>Не описано формальное доказательство причинности «память → улучшение»: парные эвалы уменьшают смешение факторов, но не устраняют вариативность LLM и времени.</li>
    <li>Для xMemory не измерено качество задач и не выполнен полный upstream pipeline; безопасный immutable eval snapshot <strong>в репозитории не найден</strong>.</li>
    <li>Нельзя восстановить скрытое рассуждение LLM; доступны только входной контекст, структурированный результат и операционный журнал.</li>
  </ul>
</section>

  for (const button of document.querySelectorAll('.tab')) {

}
